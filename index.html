oach-mate-web-notice-dismissed",BUILD="2026-09-14 · v101",DEVELOPER="1111",DEVELOPER_EMAIL="",DEMO_NAMES=["林佳蓉","陳彥廷","黃郁婷","張家豪","吳孟儒","李思穎","王柏翰","劉宜靜"],GUIDE_MD="\n# 教練小幫手 使用說明\n\n給教練管學生、課表、收費的小工具。目前是測試版，想聽聽你用起來順不順。\n\n## 一、你的資料存在哪裡\n\n打開網頁就能用，**不用註冊、沒有帳號密碼**。\n\n你輸入的東西存在**你自己手機（或電腦）的瀏覽器裡**，沒有上傳到任何伺服器。\n\n也就是說：\n\n- 只有你看得到自己的資料\n- 其他教練有他們自己的一份，不會跟你的混在一起\n- 連我也看不到你輸入了什麼\n\n## 二、資料會不會不見\n\n**這些情況都會留著：**\n\n- 關掉分頁、關掉瀏覽器\n- 手機關機重開\n- 隔天、下週再打開\n\n**這些情況會不見：**\n\n- 清除瀏覽器資料、快取或網站資料\n- 用無痕模式（隱私瀏覽），關掉視窗就沒了\n- 換手機、換電腦，或換一個瀏覽器（Safari 存的資料 Chrome 看不到）\n- **iPhone 的 Safari：連續 7 天沒打開這個網站，系統會自動清掉**\n- 手機儲存空間快滿時，系統可能清掉網站資料\n\n最後兩點最容易中招，所以請務必做下面兩件事。\n\n## 三、請做這兩件事\n\n**1. 加到主畫面（越早做越好）**\n\n- iPhone（Safari）：點下方的分享圖示，選「加入主畫面」\n- Android（Chrome）：右上角選單，選「加到主畫面」\n\n加完桌面會多一個像 App 的圖示，開起來沒有網址列，系統也比較不會把資料清掉。\n\n> ⚠️ **iPhone 很重要的一件事：桌面圖示跟 Safari 的資料是分開的。**\n>\n> 這是 iPhone 的規則，不是這個網站的問題。你在 Safari 裡輸入的學生，\n> 打開桌面圖示會看不到——但**資料沒有不見**，還好好地留在 Safari 那邊。\n>\n> 所以最省事的做法是：**一開始就先加到主畫面，之後都從桌面圖示開來用。**\n>\n> 已經在 Safari 裡輸入一堆了才發現？到「設定 → 加到主畫面 → 怎麼加？」，\n> 它會把你的資料一起帶過去，加完打開桌面圖示就在裡面了。\n> 資料量太大帶不動的話，改用「複製備份文字」→ 打開桌面圖示 → 「貼上備份文字」。\n\n**2. 定期做一份備份**\n\n到「設定 → 匯出檔案」，會得到一個 .json 檔，存到「檔案」App 或你的雲端硬碟。\n\n**如果按了沒反應**（iPhone 有時候會這樣），改用旁邊的「複製備份文字」，把整段文字複製起來，貼到記事本、傳給自己的 LINE 或 Email 存著，效果完全一樣。\n\n建議時機：輸入完一批學生之後、每週結束時、手機要送修或換機前。\n\n## 四、資料不見了怎麼辦\n\n到「設定 → 匯入檔案」，選你之前存的 .json 檔。\n\n當初是用複製文字備份的，就改用「貼上備份文字」，把那段文字貼回來。\n\n接著選「取代全部」，就會回到備份當下的狀態。\n\n## 五、換手機怎麼搬\n\n1. 舊手機：設定 → 匯出檔案，或複製備份文字\n2. 把檔案或文字傳給自己（AirDrop、LINE、Email 都可以）\n3. 新手機：打開同一個網址 → 設定 → 匯入檔案或貼上備份文字 → 取代全部\n\n## 六、常見問題\n\n**可以多個人共用同一份資料嗎？**\n\n不行。目前每位教練的資料各自獨立，不會互通。\n\n**我的學生資料會被誰看到嗎？**\n\n不會。資料沒有離開你的裝置。\n\n**沒有網路可以用嗎？**\n\n第一次要連網把頁面載進來，之後大部分操作不需要網路。但建議還是在有網路時使用。\n\n**為什麼不用登入？**\n\n測試階段刻意不做帳號，讓你點開就能試。\n\n**網頁版跟手機 App 一樣嗎？**\n\n功能大致相同。兩邊的匯出檔格式互通，網頁版匯出的檔可以匯進 App，反過來也可以。\n\n## 七、怎麼回報問題\n\n直接跟我說，附上這幾件事會最快解決：\n\n- 你用什麼手機、什麼瀏覽器\n- 在哪一頁、按了什麼\n- 發生什麼事（畫面截圖最好）\n".trim(),KEY="coach-mate-web-v1",DEFAULT_SALARY={baseSalary:0,baseSalaryMode:"always",baseSalaryThreshold:40,p
